name: Release Docker Image to AWS ECR

on:
  push:
    tags:
      - 'v*'

env:
  NODE_VERSION: 24.21.0
  AWS_REGION: eu-central-1
  # Names and network ids are terraform outputs, stored as GitHub variables (docs/release-management.md).
  ECR_REPO: ${{ vars.ECR_REPOSITORY }}
  TASK_MIGRATION_NAME: ${{ vars.ECS_MIGRATION_TASK_FAMILY }}
  TASK_NAME: ${{ vars.ECS_TASK_FAMILY }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}
  TASK_MIGRATION_LOGS: ${{ vars.ECS_MIGRATION_LOG_GROUP }}
  PRIVATE_SUBNET_IDS: ${{ vars.PRIVATE_SUBNET_IDS }}
  ECS_SECURITY_GROUP_ID: ${{ vars.ECS_SECURITY_GROUP_ID }}
  KEEP: 3

permissions:
  id-token: write
  contents: read

jobs:
  lint:
    environment: prod
    runs-on: ubuntu-latest
    name: Linting

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma types
        run: npm run db:generate

      - name: Linting
        run: npm run lint

      - name: Run knip
        run: npm run knip

      - name: Run Nestjs-doctor
        run: npm run doctor

  unit-tests:
    needs: lint
    environment: prod
    runs-on: ubuntu-latest
    name: Unit Tests

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma types
        run: npm run db:generate

      - name: Unit Tests
        run: npm test

  e2e-tests:
    needs: unit-tests
    environment: prod
    runs-on: ubuntu-latest
    name: E2E Tests

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate .env
        uses: ./.github/actions/generate-env
        with:
          DATABASE_SSL: false
          LOG_PRETTY: false

      - name: Generate Prisma types
        run: npm run db:generate

      - name: Run e2e tests
        run: npm run test:e2e

  build:
    needs: e2e-tests
    environment: prod
    runs-on: ubuntu-latest
    name: Build Application

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Generate .env
        uses: ./.github/actions/generate-env
        with:
          DATABASE_SSL: true
          LOG_PRETTY: false

      - name: Set up Docker Compose
        run: docker compose -f docker-compose.yml build production

  publish:
    needs: build
    environment: prod
    runs-on: ubuntu-latest
    name: Publish to ECR

    outputs:
      version: ${{ steps.extract.outputs.version }}
      ecr_url: ${{ steps.ecr.outputs.ecr_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check deploy variables
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          MISSING=""
          for NAME in AWS_DEPLOY_ROLE_ARN ECR_REPO TASK_NAME TASK_MIGRATION_NAME ECS_CLUSTER ECS_SERVICE \
            TASK_MIGRATION_LOGS PRIVATE_SUBNET_IDS ECS_SECURITY_GROUP_ID; do
            if [ -z "${!NAME}" ]; then
              MISSING="$MISSING $NAME"
            fi
          done

          if [ -n "$MISSING" ]; then
            echo "Missing GitHub variables (set them from terraform output):$MISSING"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1
        with:
          mask-password: true

      - name: Get ECR URL
        id: ecr
        run: |
          ECR_URL=$(aws ecr describe-repositories \
            --repository-names "${ECR_REPO}" \
            --query 'repositories[0].repositoryUri' \
            --output text)

          echo "ecr_url=$ECR_URL" >> "$GITHUB_OUTPUT"

      - name: Extract version from tag
        id: extract
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        env:
          ECR_URL: ${{ steps.ecr.outputs.ecr_url }}
          VERSION: ${{ steps.extract.outputs.version }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=true \
            --sbom=true \
            --target production \
            -t "${ECR_URL}:${VERSION}" \
            --push \
            .

      - name: Show pushed image
        env:
          ECR_URL: ${{ steps.ecr.outputs.ecr_url }}
          VERSION: ${{ steps.extract.outputs.version }}
        run: |
          echo "${ECR_URL}:${VERSION}"

  migrations:
    needs: publish
    environment: prod
    runs-on: ubuntu-latest
    name: Run Migrations

    env:
      version: ${{ needs.publish.outputs.version }}
      ecr_url: ${{ needs.publish.outputs.ecr_url }}

    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${TASK_NAME}" \
            --query taskDefinition > task.json

      # Roles, environment and secrets come from the current app task definition. jq renders it, so JSON-valued
      # environment entries (API_ALLOWED_ORIGINS, DATABASE_LOG_LEVELS) stay valid.
      - name: Render migration task definition
        env:
          IMAGE: ${{ env.ecr_url }}:${{ env.version }}
          NAME: ${{ env.TASK_MIGRATION_NAME }}
          REGION: ${{ env.AWS_REGION }}
          LOG_GROUP: ${{ env.TASK_MIGRATION_LOGS }}
        run: scripts/render-migration-task.sh ecs/migration-task.json task.json > task-def-rendered.json

      - name: Register new migration task definition
        id: register
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-def-rendered.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "task_def_arn=$TASK_DEF_ARN" >> "$GITHUB_OUTPUT"

      # Same private subnets and security group as the service: no public IP, egress through NAT or VPC endpoints.
      - name: Run migration task
        id: run-task
        env:
          TASK_DEF_ARN: ${{ steps.register.outputs.task_def_arn }}
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster "${ECS_CLUSTER}" \
            --launch-type FARGATE \
            --task-definition "${TASK_DEF_ARN}" \
            --network-configuration "awsvpcConfiguration={subnets=[${PRIVATE_SUBNET_IDS}],securityGroups=[${ECS_SECURITY_GROUP_ID}],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "task_arn=$TASK_ARN" >> "$GITHUB_OUTPUT"

      - name: Wait for migration to finish
        env:
          TASK_ARN: ${{ steps.run-task.outputs.task_arn }}
        run: |
          aws ecs wait tasks-stopped \
            --cluster "${ECS_CLUSTER}" \
            --tasks "${TASK_ARN}"

      - name: Verify migration result
        env:
          TASK_ARN: ${{ steps.run-task.outputs.task_arn }}
        run: |
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "${ECS_CLUSTER}" \
            --tasks "${TASK_ARN}" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration failed ❌"
            exit 1
          fi

          echo "Migration successful ✅"

  deploy:
    needs:
      - publish
      - migrations
    environment: prod
    runs-on: ubuntu-latest
    name: Deploy ECS

    env:
      version: ${{ needs.publish.outputs.version }}
      ecr_url: ${{ needs.publish.outputs.ecr_url }}

    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${TASK_NAME}" \
            --query taskDefinition > task.json

      - name: Update image
        run: |
          cat task.json \
            | jq --arg image "${ecr_url}:${version}" \
              '.containerDefinitions[0].image = $image
               | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' \
            > new-task.json

      - name: Register new revision
        id: revision
        run: |
          REVISION=$(aws ecs register-task-definition \
            --tags "key=app_version,value=${version}" \
            --cli-input-json file://new-task.json \
            --query "taskDefinition.revision" \
            --output text)

          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      - name: Deploy new version
        env:
          REVISION: ${{ steps.revision.outputs.revision }}
        run: |
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --task-definition "${TASK_NAME}:${REVISION}" \
            --no-cli-pager

      - name: Wait for deployment to finish
        run: |
          aws ecs wait services-stable \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}"

          echo "Deployment completed successfully 🚀"

  cleanup:
    needs: deploy
    environment: prod
    runs-on: ubuntu-latest
    name: Clean outdated revisions

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      ###############################################
      # Cleanup the app task family (keep last 3)
      ###############################################

      - name: Cleanup app task revisions (keep last 3)
        run: |
          echo "Fetching ACTIVE revisions for $TASK_NAME"

          REVISIONS=$(aws ecs list-task-definitions \
            --family-prefix "$TASK_NAME" \
            --status ACTIVE \
            --sort DESC \
            --query 'taskDefinitionArns' \
            --output text)

          COUNT=0

          for REV in $REVISIONS; do
            COUNT=$((COUNT+1))

            if [ "$COUNT" -gt "$KEEP" ]; then
              echo "Deregistering old revision: $REV"
              aws ecs deregister-task-definition \
                --task-definition "$REV"
            else
              echo "Keeping: $REV"
            fi
          done

      #########################################################
      # Cleanup the migration task family (remove all)
      #########################################################

      - name: Cleanup migration task revisions (remove all ACTIVE)
        run: |
          echo "Fetching ACTIVE revisions for $TASK_MIGRATION_NAME"

          REVISIONS=$(aws ecs list-task-definitions \
            --family-prefix "$TASK_MIGRATION_NAME" \
            --status ACTIVE \
            --sort DESC \
            --query 'taskDefinitionArns' \
            --output text)

          for REV in $REVISIONS; do
            echo "Deregistering migration revision: $REV"
            aws ecs deregister-task-definition \
              --task-definition "$REV"
          done
