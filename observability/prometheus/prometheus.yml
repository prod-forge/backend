global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # The job name is referenced by dashboards and alert rules; keep it in sync with the terraform copy.
  - job_name: nestjs-app
    metrics_path: /metrics
    static_configs:
      - targets: ['production:3000']
