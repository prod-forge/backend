services:
  production:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: production
    restart: always
    labels:
      # Promtail turns this label into the `appName` Loki label used by the logs dashboard.
      logging: ${APP_NAME:-prod-forge-backend}
    env_file:
      - .env.common
      - path: .env
        required: false
    environment:
      DATABASE_HOST: database
      DATABASE_PORT: 5432
      REDIS_HOST: cache
      REDIS_PORT: 6379
      # JSON logs so Promtail and the Loki traceId derived field can parse them.
      LOG_PRETTY: 'false'
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      # Non-secret local fallback; set JWT_SECRET in .env (>= 32 chars) to override it.
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-jwt-secret-0123456789}
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
      tempo:
        condition: service_started
    networks:
      - backend

  database:
    container_name: postgres
    image: postgres:18.3
    env_file:
      - .env.common
      - path: .env
        required: false
    environment:
      # Non-secret local fallbacks matching .env.common; override in .env.
      POSTGRES_USER: ${DATABASE_USER:-user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-user}
      POSTGRES_DB: ${DATABASE_NAME:-app}
    volumes:
      - database:/data/postgres
    ports:
      - '127.0.0.1:5332:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.max=10000
      - -c
      - pg_stat_statements.track=all

  cache:
    image: redis:8.6-alpine
    restart: always
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - cache:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    networks:
      - backend
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.5.0
    container_name: promtail
    command: -config.file=/etc/promtail/config.yml
    ports:
      - '127.0.0.1:9080:9080'
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.0
    container_name: grafana
    ports:
      - '127.0.0.1:3001:3000'
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./observability/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./observability/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - backend

  loki:
    image: grafana/loki:3.5.0
    container_name: loki
    ports:
      - '127.0.0.1:3100:3100'
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./observability/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    networks:
      - backend
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.8.2
    container_name: tempo
    command: -config.file=/etc/tempo/config.yml
    ports:
      - '127.0.0.1:3200:3200'
    volumes:
      - ./observability/tempo/config.yml:/etc/tempo/config.yml:ro
      - tempo-data:/var/tempo
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    driver: bridge

volumes:
  grafana-data:
  loki-data:
  tempo-data:
  database:
  cache:
    driver: local
