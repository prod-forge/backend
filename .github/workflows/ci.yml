name: Verification pipeline for each PR

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.21.0

jobs:
  lint:
    if: github.event_name == 'pull_request' || !startsWith(github.event.head_commit.message, 'chore(release)')
    runs-on: ubuntu-latest
    name: Linting

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma types
        run: npm run db:generate

      - name: Linting
        run: npm run lint

      - name: Run knip
        run: npm run knip

      - name: Run Nestjs-doctor
        run: npm run doctor

      - name: Check OpenAPI contract
        run: npm run openapi:check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  unit-tests:
    needs: lint
    runs-on: ubuntu-latest
    name: Unit Tests

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma types
        run: npm run db:generate

      - name: Unit Tests
        run: npm run test:cov

  e2e-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    name: E2E Tests

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate .env
        uses: ./.github/actions/generate-env
        with:
          DATABASE_SSL: false
          LOG_PRETTY: false

      - name: Generate Prisma types
        run: npm run db:generate

      - name: Run e2e tests
        run: npm run test:e2e

  build:
    needs: e2e-tests
    runs-on: ubuntu-latest
    name: Build Application

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Generate .env
        uses: ./.github/actions/generate-env
        with:
          DATABASE_SSL: true
          LOG_PRETTY: false

      - name: Check the migration task definition render
        run: scripts/render-migration-task.test.sh

      - name: Build production image
        run: docker build --target production -t prod-forge-todolist:ci .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: prod-forge-todolist:ci
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true
