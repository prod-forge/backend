name: Rollback ECS Revision

on:
  workflow_dispatch:
    inputs:
      task_revision:
        description: 'Task definition revision (for example: 23)'
        required: true

env:
  AWS_REGION: eu-central-1
  # Terraform outputs stored as GitHub variables (docs/release-management.md).
  TASK_NAME: ${{ vars.ECS_TASK_FAMILY }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}

permissions:
  id-token: write
  contents: read

jobs:
  rollback:
    environment: prod
    runs-on: ubuntu-latest
    name: Rollback ECS Revision

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Rollback ECS service
        env:
          TASK_REVISION: ${{ github.event.inputs.task_revision }}
        run: |
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --task-definition "${TASK_NAME}:${TASK_REVISION}" \
            --force-new-deployment \
            --no-cli-pager \
            > /dev/null

      - name: Wait for deployment to finish
        run: |
          echo "Waiting for ECS deployment to stabilize..."

          aws ecs wait services-stable \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}"

          echo "Deployment completed successfully!"
